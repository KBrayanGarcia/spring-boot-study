# Configuración para el entorno de Desarrollo (dev)

# H2 Console (Habilitado para pruebas rápidas)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource: Base de datos en memoria (se limpia al reiniciar)
spring.datasource.url=jdbc:h2:mem:study_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: Mostrar consultas SQL en consola en desarrollo
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
